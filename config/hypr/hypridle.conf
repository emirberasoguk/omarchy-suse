# Boşta kalma yönetimi — ekran kısma, kilit, ekran kapatma, uyku.
# Kilit için caelestia'nın kendi kilit ekranı kullanılıyor (hyprlock değil).
#
# DPMS komutları Lua config'inde TABLO argüman ister ve değerler
# enable/disable'dır. `hl.dsp.dpms("on")` geçerli Lua olduğu için hyprctl
# "ok" döner ama ekranı KAPATIR. Bkz. docs/HYPRLAND-LUA.md

general {
    lock_cmd = pidof hyprlock || qs -c caelestia ipc call lock lock
    unlock_cmd = qs -c caelestia ipc call lock unlock
    before_sleep_cmd = qs -c caelestia ipc call lock lock
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
    ignore_dbus_inhibit = false          # video oynatırken uyutma
    ignore_systemd_inhibit = false
}

# 5 dk — ekranı kıs (geri gelince eski parlaklığa dön)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 10%
    on-resume  = brightnessctl -r
}

# 5 dk — klavye ışığını kapat (cihaz yoksa sessizce geçer)
listener {
    timeout = 300
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume  = brightnessctl -rd '*::kbd_backlight'
}

# 8 dk — kilitle
listener {
    timeout = 480
    on-timeout = loginctl lock-session
}

# 10 dk — ekranı kapat
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume  = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 30 dk — uyut
# Hazırda bekletme (hibernate) yapılandırdıysan suspend-then-hibernate kullanabilirsin.
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
