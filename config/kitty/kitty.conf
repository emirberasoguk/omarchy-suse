# -----------------------------------------------------------------------------
# FONT
# -----------------------------------------------------------------------------
# kurulum.sh caelestia'nın beklediği CaskaydiaCove Nerd Font'u kurar.
font_family      CaskaydiaCove Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

# -----------------------------------------------------------------------------
# PENCERE
# -----------------------------------------------------------------------------
background_opacity 0.90
window_padding_width 12
hide_window_decorations yes

# -----------------------------------------------------------------------------
# RENKLER — caelestia şemasından
# -----------------------------------------------------------------------------
# caelestia'nın tema motoru (enableTerm) yalnızca AÇIK terminallere OSC dizisi
# gönderiyor; yeni açılan pencereler bunu görmüyor. os-kitty-tema şemadan
# caelestia.conf üretiyor, burada include ediliyor ve theme.postHook onu her
# tema değişiminde yeniliyor.
include caelestia.conf

# -----------------------------------------------------------------------------
# EK
# -----------------------------------------------------------------------------
enable_audio_bell no
copy_on_select yes
tab_bar_style powerline

# Hyprland'in Super+Ctrl/Shift+Ok kısayollarıyla çakışmasın
map ctrl+shift+up        no_op
map ctrl+shift+down      no_op
map ctrl+shift+left      no_op
map ctrl+shift+right     no_op
map ctrl+shift+home      no_op
map ctrl+shift+end       no_op
